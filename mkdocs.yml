site_name: Toybox 2.0 Documentation
site_description: Multi-Page Streamlit Application Framework with Role-Based Access Control
site_author: Liam Hsieh, PhD
site_url: https://liam-hsieh.github.io/toybox2

repo_name: liam-hsieh/toybox2
repo_url: https://github.com/liam-hsieh/toybox2

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: getting-started/quick-start.md
  - Architecture:
    - Overview: architecture/overview.md
  - Guides:
    - Sub-App Development: SUB_APP_DEVELOPMENT_GUIDE.md
    - CMake Installation: cmake_installation_guide.md
  - Tutorials:
    - Adding Sub-Applications: tutorials/adding-sub-app.md
    - Environment Variables (.env): tutorials/environment-variables.md
    - Writing Documentation: tutorials/documentation-writing.md
    - API Documentation: tutorials/api-documentation.md
    - Testing Documentation: tutorials/documentation-testing.md
    - Production Documentation Server: tutorials/documentation-production-server.md
  - Setup:
    - GitHub Pages: github-pages-setup.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true