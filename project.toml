# Project Configuration
# This file controls various features of your Python project template

[documentation]
# Enable/disable automatic GitHub Pages deployment
# Set to true to deploy docs automatically on push to main branch
# Set to false to disable GitHub Pages deployment
github_pages_enabled = true

# Documentation build settings
build_on_push = false
build_strict = false  # Fail build on warnings

# Auto-generate API documentation from source code
# Enable automatic API docs generation from Python source files
auto_generate_api_docs = true

# Source directories for API documentation generation
# Multiple directories can be specified as a list
# Each directory will be scanned for Python files to document
api_source_dirs = [
    "apps/shared",
    "apps/demo_app",
    "src/libs"
    # Add more directories as needed:
    # "apps/utilities",
    # "apps/analytics",
]

[project]
# General project settings
auto_generate_api_docs = true
include_demo_apps = false

# Future configuration options can be added here
# development_mode = false
# testing_enabled = true
# ci_cd_enabled = true